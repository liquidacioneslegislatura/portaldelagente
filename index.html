<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aplicación</title>
  <style>
    /* Eliminar márgenes y desplazamientos por defecto */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* Ocupar todo el espacio disponible */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbwX9SmDFptLUtiHmyeakT1T0UKkbXT_GNayFrcTrbWDhadTR2DCYKClgmBg95d2TwC7/exec"
    allow="geolocation; microphone; camera; clipboard-write; encrypted-media"
    loading="lazy">
  </iframe>

</body>
</html>
